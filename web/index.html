<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TabPrefix — Local Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TabPrefix — Local Editor</h1>
    <div class="left">
      <label>Group name: <input id="group" placeholder="admins"></label>
      <label>Upload image: <input id="file" type="file" accept="image/*"></label>
      <label>Animated (GIF): <input id="animated" type="checkbox"></label>
      <button id="upload">Upload & Generate Code</button>
      <div id="codebox"></div>
      <div class="help">После загрузки copy code и введи /lptab approvechanges &lt;code&gt; на сервере (или дай админу)</div>
    </div>
    <div class="right">
      <div class="preview-wrap">
        <canvas id="preview" width="520" height="180"></canvas>
      </div>
      <div class="controls">
        <button id="left">◀</button>
        <button id="right">▶</button>
        <button id="up">▲</button>
        <button id="down">▼</button>
        <label>Scale: <input id="scale" type="range" min="0.2" max="2" step="0.01" value="1"></label>
        <label>FrameDelay(ms): <input id="framedelay" type="number" value="200"></label>
      </div>
    </div>
  </div>
<script src="app.js"></script>
</body>
</html>
